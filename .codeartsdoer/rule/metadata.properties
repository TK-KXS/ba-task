projectExpert=[{"filePath":"tk-standards.mdc","name":"tk-standards","description":"TK Company pre-sales standards for every requirements or architecture deliverable in this workspace. Always apply.","content":"---\ndescription: TK Company pre-sales standards for every requirements or architecture deliverable in this workspace. Always apply.\nalwaysApply: true\n---\n\n# TK pre-sales standards (always apply)\n\nThis workspace produces **two formal TK deliverables** from rough customer input:\na **requirements package** (Output 2) and a **solution architecture & workflow\npack** (Output 3). Both are single, self-contained A4 HTML files stamped\n\"TK Company – Confidential\".\n\n**Skills are the standard, not suggestions.** Load them before writing:\n\n- Requirements work: `tk-ba-requirements` (orchestrator) → `tk-ba-analysis`,\n  `tk-ba-scope`, `tk-ba-technical-requirements`, `tk-ba-functional-spec`,\n  `tk-ba-user-stories`, `tk-ba-commercial-awareness`.\n- Architecture work: `tk-solution-architecture` (orchestrator) →\n  `tk-process-modelling`, `tk-platform-tools`, `tk-architecture-rules`,\n  `tk-diagram-standards`.\n- Both: `tk-doc-a4-confidential` for the document shell.\n\n**Deliverables live in `.codeartsdoer/deliverables/<project>/`** with IDs\n`TK-BA-<PROJECT>-REQ-<nn>` and `TK-SA-<PROJECT>-ARC-<nn>`. Keep the raw customer\ninput there as `input.md` for traceability.\n\n**Non-negotiables**\n\n- **Never silently resolve a stakeholder conflict.** Record it as `OI-` with both\n  positions, a decision owner and a due date.\n- **Never invent numbers or integrations.** Everything traces to the input;\n  unverified figures become `AS-` assumptions with an owner. When two figures are\n  given, size with the higher one and flag it.\n- **Testability.** Every requirement is one \"The system shall …\" statement with\n  an ID, priority, source and measurable acceptance. If a tester can't write a\n  pass/fail test from it, it isn't a requirement yet.\n- **Architecture rules.** Channels never touch a database; SAP / POS / marketplace\n  traffic only via TK-Connect; every non-TK component needs an ADR; money flows are\n  idempotent, reconciled and audited; PDPA data is classified, encrypted, masked\n  and retention-bound; peak load is sized with headroom.\n- **Document format.** \"TK Company – Confidential\" in the header AND footer of\n  every page with a page number; cover, document control and TOC present; opens\n  offline as a single file; prints to A4 with nothing clipped; every diagram is\n  inline SVG carrying the in‑SVG \"TK CONFIDENTIAL\" label.\n- **Honest reporting.** Never claim a check or verification passed unless it was\n  run in this session and seen to pass.\n\n**Who does what.** Authors: `tk-ba`, `tk-sa`. Verifiers (independent, report-only):\n`tk-senior-ba`, `tk-senior-sa`. Final document gate: `tk-doc-qa`. The\n`tk-presales-delivery` team scene orchestrates them; the Delivery Lead never writes\nthe documents itself.\n\n**Language.** Write documents in English by default; keep Thai business terms with\na glossary; keep all IDs, code and file names in English.","triggerType":"always","source":"project","absolutePath":"/Users/karitsookpreedee/Desktop/Huawei/codearts-agent/ba-task/.codeartsdoer/rule/tk-standards.mdc"}]